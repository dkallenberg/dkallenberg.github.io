  <script>
    const DEFAULT_BEARER_TOKEN = "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9.eyJhdWQiOiIzIiwianRpIjoiNzMzODkyNTBjNjA3MTg1NGI1YTA4Njg5MDNmYTkwMmM2MjM3YjBkYTQzZmNmODQzOTc0MjA5NmM5MmE3MzcwNGExZmI2ZmE0YWNmZjUyYmYiLCJpYXQiOjE3OTM0MDYzOTIuMzYxMjYwOSwibmJmIjoxNzkzNDA2MzkyLjM2MTI2MywiZXhwIjoyNzQwMTc3NTkyLjM1NjY5MjgsInN1YiI6IjEyMzUzOSIsInNjb3BlcyI6W119.BZpXY1KL9WZHW_O-igw3qa1d4gBhW0efci3RfeCH5eHf_66T1zYQx0uuhBjpmRjFPBaEu2V_8bR0wQs4H7j1cb4oz3_Vwd_zle8VWBcdL7ScjfGL1rF69Mpv8W8Tja1RH6Pe3Hus3RHlf-MN4Kh1osLJSu-kIsKaPpZBIwtFTVPHGK7L5V7d0j9Nr5AHudovAiSYk8Xzl8kM7F1OhkpwrsyBeK59XzaLu5VeKWt0gKtBj444U53YJlMuxqdu7g2mO5ZssXZJHLhBwY1pfXxMu8V-Pt_vvlmNF1YqXpMLx8AhrVhhwlVCnH2VrPsu4xqTKi431Lld3WcQTsJZvQbdZbU5B7gfMTgE0HoWjkTXZDjzJI8mhD8UmQG1DyRpiLmtIL5lBcIyoKntfhR8uvdnlEG1u6LnUN2kaTg6amUAUDMAT5KI7iRd4C-6jIiIIB_Yo3R8D_no-Sqmg3UixFwyqC7W1dRi18X1NYgEMtxEwvPjc1r_0RS3HLy3oHah0-FFj5FpXYu0oZ1SgyZaZYCR5mqiIHwG7kfgYrn5c2SSFLqgzs6eZRTZ8F1qirWBe83oMZYw1wACP3rK4yHXT5aWUPDEprnQBbmBGyU8bgLczJU48SlF9Yxc7G0bEhvXjjKd04iMiuIkLxpalniq-m-aqgII86qNsyjogWECWspRrSo";
    const API_BASE = 'https://events.vex.com/api/v2';
    const ROUND_NAMES = { 9: 'Round of 128', 8: 'Round of 64', 7: 'Round of 32', 6: 'Round of 16', 3: 'Quarterfinals', 4: 'Semifinals', 5: 'Finals' };
    const ROUND_SHORT = { 9: 'R128', 8: 'R64', 7: 'R32', 6: 'R16', 3: 'QF', 4: 'SF', 5: 'F' };
    const ROUND_ORDER = [9, 8, 7, 6, 3, 4, 5];
    const REFRESH_MS = 60000;

    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const parseTeams = (str) => [...new Set(String(str || '').toUpperCase().split(/[\s,;]+/).map(x => x.trim()).filter(Boolean))];

    let follow = [];
    let divisions = [];        // [{id, name, matches:[]}]
    let activeDiv = null;
    let eventInfo = null;
    let timer = null, busy = false, currentSku = '';

    const isFollowed = (n) => {
      const u = String(n || '').toUpperCase();
      return follow.some(t => u === t || (/^\d+$/.test(t) && new RegExp('^' + t + '[A-Z]$').test(u)));
    };

    // ---------- API ----------
    async function apiGet(path) {
      let res;
      try {
        res = await fetch(API_BASE + path, { headers: { 'Authorization': `Bearer ${DEFAULT_BEARER_TOKEN}`, 'Accept': 'application/json' } });
      } catch (e) { throw new Error('Could not reach events.vex.com. Check your connection and open this file directly from your computer.'); }
      if (res.status === 401 || res.status === 403) throw new Error('The API rejected the token built into this page.');
      if (res.status === 429) throw new Error('Too many requests. Wait a minute and try again.');
      if (!res.ok) throw new Error(`events.vex.com returned an error (${res.status}).`);
      return res.json();
    }
    async function apiAll(path) {
      let page = 1, last = 1, rows = [];
      do {
        const j = await apiGet(`${path}${path.includes('?') ? '&' : '?'}per_page=250&page=${page}`);
        rows = rows.concat(j.data || []);
        last = (j.meta && j.meta.last_page) || 1;
        page++;
      } while (page <= last);
      return rows;
    }

    // ---------- Status ----------
    function showStatus(msg, type = 'info') {
      const el = $('statusMsg');
      el.textContent = msg;
      el.className = 'rounded-xl p-4 border text-sm ' + (type === 'error'
        ? 'bg-red-500/10 border-red-500/30 text-red-300' : 'bg-blue-500/10 border-blue-500/30 text-blue-300');
    }
    const hideStatus = () => $('statusMsg').className = 'hidden';


    // ---------- Demo mode (event code "Demo-Mode") ----------
    const DEMO_SKU = 'DEMO-MODE';
    const DEMO_ALLIANCES = {
      1: ['587U', '3009C'], 2: ['1010X', '4412D'], 3: ['586A', '7120B'], 4: ['586E', '2005F'],
      5: ['587W', '6611G'], 6: ['3456H', '8822J'], 7: ['587Y', '9910K'], 8: ['2468M', '1357N']
    };
    const DEMO_RANKS = new Map();
    Object.entries(DEMO_ALLIANCES).forEach(([n, teams]) => { DEMO_RANKS.set(teams[0], Number(n)); DEMO_RANKS.set(teams[1], 8 + Number(n)); });
    // 586E's alliance (4) wins: a tied quarterfinal gets replayed, then it takes the finals 2-1.
    const DEMO_SCRIPT = [
      { s: 'QF1', round: 3, inst: 1, num: 1, a: 1, b: 8, sa: 62, sb: 41 },
      { s: 'QF2', round: 3, inst: 2, num: 1, a: 4, b: 5, sa: 48, sb: 48 },
      { s: 'QF3', round: 3, inst: 3, num: 1, a: 2, b: 7, sa: 58, sb: 50 },
      { s: 'QF4', round: 3, inst: 4, num: 1, a: 3, b: 6, sa: 49, sb: 53 },
      { s: 'QF2', round: 3, inst: 2, num: 2, a: 4, b: 5, sa: 55, sb: 47 },
      { s: 'SF1', round: 4, inst: 1, num: 1, a: 'W:QF1', b: 'W:QF2', sa: 57, sb: 60 },
      { s: 'SF2', round: 4, inst: 2, num: 1, a: 'W:QF3', b: 'W:QF4', sa: 65, sb: 52 },
      { s: 'F', round: 5, inst: 1, num: 1, a: 'W:SF1', b: 'W:SF2', sa: 66, sb: 70 },
      { s: 'F', round: 5, inst: 1, num: 2, a: 'W:SF2', b: 'W:SF1', sa: 64, sb: 72 },
      { s: 'F', round: 5, inst: 1, num: 3, a: 'W:SF1', b: 'W:SF2', sa: 75, sb: 68 }
    ];
    const DEMO_TICK_MS = 3500;
    let demoStep = 0;
    const demoBase = Date.now();

    function demoBuild(step) {
      const wins = {}, winners = {}, lastIdx = {}, matches = [];
      DEMO_SCRIPT.forEach((g, i) => {
        const need = g.round === 5 ? 2 : 1;
        // follow-up games only exist once the previous game was played and the series is still open
        if (g.num > 1 && (lastIdx[g.s] === undefined || lastIdx[g.s] >= step || winners[g.s])) return;
        lastIdx[g.s] = i;
        const resolve = (t) => typeof t === 'number' ? t : (winners[t.slice(2)] ?? null);
        const A = resolve(g.a), B = resolve(g.b);
        const scored = i < step;
        if (scored) {
          wins[g.s] = wins[g.s] || {};
          const w = g.sa > g.sb ? A : g.sb > g.sa ? B : null;
          if (w) { wins[g.s][w] = (wins[g.s][w] || 0) + 1; if (wins[g.s][w] >= need) winners[g.s] = w; }
        }
        const when = new Date(demoBase + i * 8 * 60000).toISOString();
        const mk = (color, no, score) => ({ color, score: scored ? score : 0,
          teams: (no ? DEMO_ALLIANCES[no] : []).map(n => ({ team: { name: n } })) });
        matches.push({ id: i + 1, round: g.round, instance: g.inst, matchnum: g.num, field: 'Field ' + ((i % 2) + 1),
          scheduled: when, started: scored ? when : null, scored,
          alliances: [mk('red', A, g.sa), mk('blue', B, g.sb)] });
      });
      return matches;
    }

    function demoLoad() {
      eventInfo = { name: 'Demo Mode Championship', location: { city: 'Demo City', region: 'IN' } };
      divisions = [{ id: 1, name: 'Demo Division', matches: demoBuild(demoStep), ranks: DEMO_RANKS }];
      activeDiv = 1;
      render();
      $('lastUpdated').innerHTML = demoStep >= DEMO_SCRIPT.length
        ? '<span class="text-emerald-400">Demo complete</span>'
        : `<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>Demo mode · simulated tournament`;
    }

    // ---------- Load ----------
    async function load(sku, silent = false) {
      if (sku === DEMO_SKU) { demoLoad(); return; }
      const ev = await apiGet(`/events?sku%5B%5D=${encodeURIComponent(sku)}`);
      if (!ev.data || !ev.data.length) throw new Error(`No event found with code ${sku}.`);
      const event = ev.data[0];
      const divs = (event.divisions && event.divisions.length) ? event.divisions : [{ id: 1, name: 'Division 1' }];
      const loaded = [];
      for (const d of divs) {
        const matches = await apiAll(`/events/${event.id}/divisions/${d.id}/matches`);
        const rankRows = await apiAll(`/events/${event.id}/divisions/${d.id}/rankings`).catch(() => []);
        const ranks = new Map();
        rankRows.forEach(r => { const n = (r.team?.name || '').toUpperCase(); if (n && r.rank) ranks.set(n, r.rank); });
        loaded.push({ id: d.id, name: d.name || `Division ${d.id}`, matches, ranks });
      }
      eventInfo = event;
      divisions = loaded;
      if (!activeDiv || !divisions.some(d => d.id === activeDiv)) {
        // default to the division with the most elimination matches
        const count = (d) => d.matches.filter(m => ROUND_ORDER.includes(m.round)).length;
        activeDiv = [...divisions].sort((a, b) => count(b) - count(a))[0].id;
      }
      render();
    }

    // ---------- Bracket model ----------
    const isScored = (m) => {
      if (m.scored === true) return true;
      const r = (m.alliances || []).find(a => a.color === 'red'), b = (m.alliances || []).find(a => a.color === 'blue');
      const rs = Number(r?.score), bs = Number(b?.score);
      return Number.isFinite(rs) && Number.isFinite(bs) && (rs + bs) > 0;
    };
    const teamNames = (a) => (a?.teams || []).map(t => t.team?.name).filter(Boolean);

    function buildSeries(matches, ranks = new Map()) {
      const elim = matches.filter(m => ROUND_ORDER.includes(m.round));
      const groups = new Map();
      elim.forEach(m => {
        const k = m.round + '-' + m.instance;
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(m);
      });
      const series = [];
      groups.forEach((list, key) => {
        list.sort((a, b) => a.matchnum - b.matchnum);
        const first = list[0];
        const redA = (first.alliances || []).find(a => a.color === 'red');
        const blueA = (first.alliances || []).find(a => a.color === 'blue');
        const sideA = { teams: teamNames(redA), wins: 0 }, sideB = { teams: teamNames(blueA), wins: 0 };
        const games = list.map(m => {
          const r = (m.alliances || []).find(a => a.color === 'red'), b = (m.alliances || []).find(a => a.color === 'blue');
          let aAlliance = r, bAlliance = b;
          const rn = teamNames(r), bn = teamNames(b);
          const overlapR = rn.filter(n => sideA.teams.includes(n)).length, overlapB = bn.filter(n => sideA.teams.includes(n)).length;
          if (overlapB > overlapR) { aAlliance = b; bAlliance = r; }
          if (!sideA.teams.length && teamNames(aAlliance).length) sideA.teams = teamNames(aAlliance);
          if (!sideB.teams.length && teamNames(bAlliance).length) sideB.teams = teamNames(bAlliance);
          const scored = isScored(m);
          const sa = Number(aAlliance?.score) || 0, sb = Number(bAlliance?.score) || 0;
          if (scored) { if (sa > sb) sideA.wins++; else if (sb > sa) sideB.wins++; }
          return { m, scored, sa, sb, tied: scored && sa === sb, label: m.matchnum };
        });
        // Alliance rank = best qualification rank among its teams (the alliance captain)
        const captainOf = (teams) => {
          const ranked = teams.filter(n => ranks.get(String(n).toUpperCase()))
            .sort((a, b) => ranks.get(String(a).toUpperCase()) - ranks.get(String(b).toUpperCase()));
          return ranked.length ? { name: ranked[0], rank: ranks.get(String(ranked[0]).toUpperCase()) } : null;
        };
        sideA.captain = captainOf(sideA.teams);
        sideB.captain = captainOf(sideB.teams);
        const round = first.round;
        const needed = round === 5 ? 2 : 1;
        const winner = sideA.wins >= needed ? 'A' : sideB.wins >= needed ? 'B' : null;
        series.push({ key, round, instance: first.instance, sideA, sideB, games, winner, needed,
          tied: games.filter(g => g.tied).map(g => g.label),
          field: first.field || '', time: first.started || first.scheduled || '' });
      });
      // Alliance number = order of the alliance captains by qualification rank (1 = top seed)
      const caps = new Map();
      series.forEach(se => [se.sideA, se.sideB].forEach(sd => { if (sd.captain) caps.set(sd.captain.name, sd.captain.rank); }));
      const numbers = new Map([...caps.entries()].sort((a, b) => a[1] - b[1]).map(([name], i) => [name, i + 1]));
      series.forEach(se => [se.sideA, se.sideB].forEach(sd => { sd.rank = sd.captain ? numbers.get(sd.captain.name) : null; }));
      return series;
    }

    // ---------- Render ----------
    function render() {
      const div = divisions.find(d => d.id === activeDiv);
      $('eventName').textContent = eventInfo.name || currentSku;
      $('eventMeta').textContent = [currentSku, eventInfo.location?.city, eventInfo.location?.region].filter(Boolean).join(' · ');

      $('divTabs').innerHTML = divisions.length > 1 ? divisions.map(d => `
        <button data-div="${d.id}" class="div-tab text-xs font-semibold px-3.5 py-1.5 rounded-lg transition ${d.id === activeDiv ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-white'}">${esc(d.name)}</button>`).join('') : '';
      document.querySelectorAll('.div-tab').forEach(b => b.addEventListener('click', () => { activeDiv = Number(b.dataset.div) || b.dataset.div; render(); }));

      const series = buildSeries(div.matches, div.ranks);
      $('bracketWrap').classList.remove('hidden');
      if (!series.length) {
        $('bracket').innerHTML = '<p class="text-sm text-slate-400 py-6 px-2">No elimination matches are posted for this division yet. The bracket appears after alliance selection.</p>';
        return;
      }
      hideStatus();

      const champ = series.find(x => x.round === 5 && x.winner);
      if (champ) {
        const side = champ.winner === 'A' ? champ.sideA : champ.sideB;
        $('champion').className = 'rounded-xl border border-amber-500/40 bg-amber-500/10 px-4 py-3 text-sm flex flex-wrap items-center gap-2';
        $('champion').innerHTML = `<span class="font-extrabold uppercase tracking-wide text-amber-400">Champions</span>` +
          `<span class="font-bold text-white">${side.rank ? 'Alliance ' + side.rank + ': ' : ''}${side.teams.map(n => isFollowed(n) ? `<span class="px-1 rounded bg-amber-500/20 text-amber-400">${esc(n)}</span>` : esc(n)).join(', ')}</span>`;
      } else { $('champion').className = 'hidden'; }

      // current series = first unscored elimination match
      const elimMatches = div.matches.filter(m => ROUND_ORDER.includes(m.round)).sort((a, b) => {
        const ta = a.started || a.scheduled || '', tb = b.started || b.scheduled || '';
        return (ta && tb && ta !== tb) ? (ta < tb ? -1 : 1) : (ROUND_ORDER.indexOf(a.round) - ROUND_ORDER.indexOf(b.round)) || (a.instance - b.instance) || (a.matchnum - b.matchnum);
      });
      const cur = elimMatches.find(m => !isScored(m));
      const curKey = cur ? cur.round + '-' + cur.instance : null;

      const cols = ROUND_ORDER.filter(r => series.some(s => s.round === r));
      $('bracket').innerHTML = cols.map(r => {
        const list = series.filter(s => s.round === r).sort((a, b) => a.instance - b.instance);
        return `
        <div class="flex flex-col w-64 shrink-0">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 text-center">${esc(ROUND_NAMES[r])}</h3>
          <div class="flex flex-col justify-around gap-4 flex-1">${list.map(s => seriesCard(s, s.key === curKey)).join('')}</div>
        </div>`;
      }).join('');
    }

    // Lower alliance number is always red and on top; higher alliance number is blue and on the bottom
    const SIDE_COLORS = {
      red:  { bg: 'hsl(0 75% 50% / .16)',   bar: 'hsl(0 75% 50%)',   badge: 'hsl(0 70% 42%)' },
      blue: { bg: 'hsl(215 85% 55% / .16)', bar: 'hsl(215 85% 55%)', badge: 'hsl(215 75% 42%)' }
    };

    function sideRow(side, color, isWinner, hasWinner, wins, showWins, lastScore) {
      const c = SIDE_COLORS[color];
      const rowStyle = side.teams.length ? `background:${c.bg};border-left:4px solid ${c.bar}` : 'border-left:4px solid transparent';
      const names = side.teams.length
        ? side.teams.map(n => isFollowed(n) ? `<span class="px-1 rounded bg-amber-500/25 text-amber-400 font-bold">${esc(n)}</span>` : esc(n)).join(', ')
        : '<span class="text-slate-500 italic">TBD</span>';
      const num = showWins ? wins : (lastScore ?? '');
      const rankTag = (side.rank && side.teams.length)
        ? `<span class="inline-block mr-1.5 px-1.5 py-0.5 rounded text-[10px] font-bold align-middle" style="background:${c.badge};color:#fff" title="Alliance ${side.rank}">${side.rank}</span>` : '';
      return `
        <div class="flex items-center justify-between gap-2 px-3 py-2 ${hasWinner && !isWinner ? 'opacity-60' : ''}" style="${rowStyle}">
          <div class="text-xs ${isWinner ? 'font-bold text-white' : 'text-slate-200'} leading-snug">${rankTag}${names}</div>
          <div class="text-sm font-extrabold tabular-nums ${isWinner ? 'text-emerald-400' : 'text-slate-300'}">${isWinner ? '✓ ' : ''}${num}</div>
        </div>`;
    }

    function seriesCard(s, isCurrent) {
      // Finals show series wins; every other round shows the score of the latest match played
      const multi = s.round === 5;
      const played = s.games.filter(g => g.scored);
      const last = played[played.length - 1];
      const hasWinner = !!s.winner;
      const label = (s.round === 5 ? 'Finals' : `${ROUND_SHORT[s.round]} ${s.instance}`);
      const a = { key: 'A', side: s.sideA, score: last ? last.sa : null };
      const b = { key: 'B', side: s.sideB, score: last ? last.sb : null };
      const swap = s.sideA.rank && s.sideB.rank && s.sideB.rank < s.sideA.rank;
      const top = swap ? b : a, bottom = swap ? a : b;
      const tieText = s.tied.length ? (s.games.length > 1 ? s.tied.map(n => `M${n} TIE`).join(' · ') : 'TIE') : '';
      return `
        <div class="rounded-xl border ${isCurrent ? 'border-amber-500/60 ring-2 ring-amber-400/40' : 'border-slate-700'} bg-slate-900 overflow-hidden shadow-md">
          <div class="flex items-center justify-between gap-2 px-3 py-1.5 border-b border-slate-700 bg-slate-800 text-[11px]">
            <span class="font-bold text-slate-300 uppercase tracking-wide">${esc(label)}</span>
            <span class="flex items-center gap-2">
              ${tieText ? `<span class="font-bold px-1.5 py-0.5 rounded bg-slate-700 text-slate-200">${esc(tieText)}</span>` : ''}
              ${isCurrent ? '<span class="font-bold text-amber-400 animate-pulse">NOW</span>' : `<span class="text-slate-400">${esc(s.field)}</span>`}
            </span>
          </div>
          ${sideRow(top.side, 'red', s.winner === top.key, hasWinner, top.side.wins, multi, top.score)}
          <div class="h-px bg-slate-700"></div>
          ${sideRow(bottom.side, 'blue', s.winner === bottom.key, hasWinner, bottom.side.wins, multi, bottom.score)}
        </div>`;
    }

    // ---------- Refresh / controls ----------
    function stamp(failed) {
      $('lastUpdated').innerHTML = failed
        ? '<span class="text-amber-400">Update failed, retrying in 1 min</span>'
        : `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>Live · updated ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}`;
    }
    async function refresh() {
      if (busy || !currentSku) return;
      busy = true;
      try { await load(currentSku, true); stamp(false); } catch (e) { console.error(e); stamp(true); } finally { busy = false; }
    }
    async function start() {
      const sku = $('skuInput').value.trim().toUpperCase();
      if (!sku) { showStatus('Enter an event code.', 'error'); return; }
      follow = parseTeams($('teamsInput').value);
      currentSku = sku; activeDiv = null;
      clearInterval(timer);
      $('bracketWrap').classList.add('hidden');
      showStatus('Loading bracket…');
      $('loadBtn').disabled = true;
      try {
        if (sku === DEMO_SKU) {
          if (!follow.length) { follow = ['586', '587']; $('teamsInput').value = '586, 587'; }
          demoStep = 0;
          await load(sku);
          timer = setInterval(() => { if (demoStep < DEMO_SCRIPT.length) { demoStep++; demoLoad(); } }, DEMO_TICK_MS);
        } else {
          await load(sku);
          stamp(false);
          timer = setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
        }
        const back = new URLSearchParams({ sku, teams: follow.join(',') });
        $('backLink').href = 'vex.matches.html?' + back.toString();
      } catch (e) {
        showStatus(e.message, 'error');
      } finally { $('loadBtn').disabled = false; }
    }

    function updateThemeIcon() {
      const dark = document.documentElement.classList.contains('dark');
      $('themeToggleBtn').innerHTML = `<i data-lucide="${dark ? 'moon' : 'sun'}" class="w-4 h-4"></i>`;
      lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      let saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      document.documentElement.classList.toggle('dark', saved !== 'light');
      $('themeToggleBtn').addEventListener('click', () => {
        const dark = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
        updateThemeIcon();
      });
      updateThemeIcon();
      $('loadBtn').addEventListener('click', start);
      ['skuInput', 'teamsInput'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') start(); }));
      const p = new URLSearchParams(location.search);
      let teams = p.get('teams') || '';
      if (!teams) { try { teams = localStorage.getItem('vex_teams') || ''; } catch (e) {} }
      $('teamsInput').value = teams;
      if (p.get('sku')) { $('skuInput').value = p.get('sku'); start(); }
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden && currentSku && currentSku !== DEMO_SKU) refresh(); });
  </script>
</body>
</html>
